[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cookt"
version = "0.1.0"
description = "A self-hosted household recipe app that runs on local models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.136.3",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "mcp==1.27.2",
  "pillow==12.2.0",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.49.0",
  "python-multipart==0.0.20",
  "cryptography==50.0.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.0",
  "psycopg[binary]==3.2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/cookt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "local_model: opt-in tests against the local llama-swap endpoint",
  "network: opt-in tests that fetch real URLs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
