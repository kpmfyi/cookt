    <title>cookt</title>
    <script>
      // No-flash theme init: apply the saved theme before first paint.
      try {
        var t = JSON.parse(localStorage.getItem("cookt:theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#000000" : "#ffffff");
      } catch (e) {}
    </script>
    <style>
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #000000; } }
      html[data-theme="dark"] { background: #000000; }
    </style>
